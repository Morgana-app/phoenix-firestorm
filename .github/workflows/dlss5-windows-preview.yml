name: Build Windows DLSS5 preview

on:
  workflow_dispatch:
    inputs:
      build_viewer:
        description: Also build the complete unsigned viewer (slower)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dlss5-windows-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    name: Observer, helper and integration bundle
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download pinned public integration dependencies
        run: ./tools/dlss5-observer/Get-CiDependencies.ps1
      - name: Build, test and package integration
        run: ./tools/dlss5-observer/Build-CiIntegration.ps1
      - name: Upload integration download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestorm-dlss5-integration-windows-x64
          path: tools/dlss5-observer/build/ci-download/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlss5-integration-test-results
          path: |
            tools/dlss5-observer/build/ci-observer/Testing/
            tools/dlss5-observer/build/feeder-helper/build.log
          if-no-files-found: ignore
          retention-days: 7

  viewer:
    name: Unsigned OpenAL viewer
    if: inputs.build_viewer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      AUTOBUILD_ADDRSIZE: '64'
      AUTOBUILD_VSVER: '170'
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
      AUTOBUILD_GITHUB_TOKEN: ${{ github.token }}
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FirestormViewer/fs-build-variables
          ref: c17312d38377c003977cf5b6dcc83c6042eba194
          path: build-variables
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install public build tools
        run: |
          python -m pip install autobuild==3.10.2 llbase llsd
          if ($LASTEXITCODE) { throw 'Python dependency installation failed.' }
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE) { throw 'NSIS installation failed.' }
          'C:\Program Files (x86)\NSIS' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          'C:\Program Files\Git\usr\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure and build viewer
        run: ./tools/dlss5-observer/Build-CiViewer.ps1
      - name: Upload viewer download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestorm-dlss5-viewer-windows-x64
          path: tools/dlss5-observer/build/ci-viewer-download/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload viewer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dlss5-viewer-build-logs
          path: |
            tools/dlss5-observer/build/ci-viewer-logs/
            build-vc170-64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
